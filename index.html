<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让页面铺满刘海屏，配合 CSS 的 env(safe-area-inset-*) 留出安全区 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>woge博客</title>
    <meta name="description" content="基于 React + Supabase 的个人博客" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- og:* 一律交给各页面的 Helmet 渲染：
         静态写在 head 里会排在最前面，社交平台取第一个匹配项，
         导致详情页/简历页自己设置的 og:title 永远不生效。默认值见 src/App.tsx。 -->
    <link rel="alternate" type="application/rss+xml" title="woge博客 RSS" href="/rss.xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
